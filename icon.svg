<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- App icon: two gymnastic rings on straps, drawn to read at 48px.
       Colours match the app's dark theme background, accent and good. -->
  <rect width="512" height="512" rx="112" fill="#0f1320"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <defs>
    <radialGradient id="glow" cx="0.75" cy="0.1" r="0.9">
      <stop offset="0%" stop-color="#21305a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f1320" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- straps -->
  <g stroke="#4f8cff" stroke-width="17" stroke-linecap="round" opacity="0.55">
    <path d="M168 96 v104"/>
    <path d="M344 96 v104"/>
  </g>
  <!-- anchor bar -->
  <rect x="120" y="80" width="272" height="20" rx="10" fill="#4f8cff" opacity="0.75"/>

  <!-- rings -->
  <g fill="none" stroke="#36d399" stroke-width="30">
    <circle cx="168" cy="288" r="82"/>
    <circle cx="344" cy="288" r="82"/>
  </g>
</svg>
