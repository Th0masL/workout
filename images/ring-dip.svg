<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 442" width="1080" height="442" role="img"
     aria-label="Ring dip: seated L with the backside on the floor, pressing up to lockout, and later unassisted with the rings at sternum">
  <title>Ring dip — start seated with the rings low, finish unassisted with them high</title>

  <g transform="translate(0,0)">
    <line x1="16" y1="340" x2="344" y2="340" stroke="#5d6b85" stroke-width="3"/>
    
    <line x1="16" y1="244" x2="344" y2="244" stroke="#4f8cff" stroke-width="1"
          stroke-dasharray="3 6" opacity=".5"/>
    <text x="342" y="236" fill="#4f8cff" font-size="11.5" text-anchor="end"
          opacity=".85" font-family="system-ui,sans-serif">rings · seated shoulder height</text>
    <path d="M106 8 L106 244" stroke="#4f8cff" stroke-width="2.5" opacity=".6"/>
    <path d="M158 8 L158 244" stroke="#4f8cff" stroke-width="2.5" opacity=".6"/>
    <ellipse cx="106" cy="244" rx="12" ry="6.5" fill="none" stroke="#4f8cff" stroke-width="4"/>
    <ellipse cx="158" cy="244" rx="12" ry="6.5" fill="none" stroke="#4f8cff" stroke-width="4"/>
    <circle cx="129" cy="234" r="14" fill="none" stroke="#c9d4e8" stroke-width="4"/>
    <path d="M132 249 L132 334" stroke="#c9d4e8" stroke-width="6" stroke-linecap="round"/>
    <path d="M132 256 L158 244" stroke="#c9d4e8" stroke-width="5" stroke-linecap="round"/>
    <path d="M132 334 L282 334" stroke="#c9d4e8" stroke-width="6" stroke-linecap="round"/>
    <path d="M70 334 L110 334" stroke="#36d399" stroke-width="2.5"/>
    <text x="20" y="324" fill="#36d399" font-size="12.5"
