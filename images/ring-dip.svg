    <path d="M106 8 L106 244" stroke="#4f8cff" stroke-width="2.5" opacity=".6"/>
    <path d="M158 8 L158 244" stroke="#4f8cff" stroke-width="2.5" opacity=".6"/>
    <ellipse cx="106" cy="244" rx="12" ry="6.5" fill="none" stroke="#4f8cff" stroke-width="4"/>
