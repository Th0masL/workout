    <text x="180.0" y="402" fill="#c9d4e8" font-size="16.5" font-weight="600"
          text-anchor="middle" font-family="system-ui,sans-serif">Later — bodyweight</text>
    <text x="180.0" y="422" fill="#8b97ad" font-size="12.5"
          text-anchor="middle" font-family="system-ui,sans-serif">rings back up, feet clear</text>
    
  </g>
