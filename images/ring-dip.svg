    <circle cx="129" cy="121" r="14" fill="none" stroke="#c9d4e8" stroke-width="4"/>
    <path d="M132 137 L132 219" stroke="#c9d4e8" stroke-width="6" stroke-linecap="round"/>
    <path d="M132 153 L180 153" stroke="#36d399" stroke-width="6" stroke-linecap="round"/>
    <path d="M180 153 L158 131" stroke="#c9d4e8" stroke-width="5" stroke-linecap="round"/>
    <text x="190" y="149" fill="#36d399" font-size="12.5" font-family="system-ui,sans-serif">upper arm</text>
