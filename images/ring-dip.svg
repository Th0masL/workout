    <circle cx="129" cy="144" r="14" fill="none" stroke="#c9d4e8" stroke-width="4"/>
    <path d="M132 159 L132 244" stroke="#c9d4e8" stroke-width="6" stroke-linecap="round"/>
    <path d="M132 166 L158 244" stroke="#c9d4e8" stroke-width="5" stroke-linecap="round"/>
    <path d="M132 244 L270 334" stroke="#c9d4e8" stroke-width="6" stroke-linecap="round"/>
    <path d="M86 330 L86 252" stroke="#36d399" stroke-width="2.5"/>
    <path d="M79 260 L86 251 L93 260" fill="none"
