    <text x="20" y="60" fill="#8b97ad" font-size="12.5" font-family="system-ui,sans-serif">hands at your SIDES,</text>
    <text x="20" y="78" fill="#8b97ad" font-size="12.5" font-family="system-ui,sans-serif">never behind you</text>
    <text x="180.0" y="402" fill="#c9d4e8" font-size="16.5" font-weight="600"
