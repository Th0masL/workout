<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 292" width="1020" height="292" role="img"
     aria-label="Front plank: elbows under the shoulders, a hand ahead, then fully extended forward">
  <title>Front plank — sliding the elbows forward is the progression, not adding time</title>
  <text x="16" y="32" fill="#36d399" font-size="13" font-family="system-ui,sans-serif">the lever is the load — not the clock</text>

  <g transform="translate(0,0)">
    <line x1="14" y1="186" x2="326" y2="186" stroke="#5d6b85" stroke-width="3"/>
    <path d="M118 182 L158 182" stroke="#c9d4e8" stroke-width="7" stroke-linecap="round"/>
    <path d="M118 182 L118 128" stroke="#c9d4e8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="103" cy="115" r="12.5" fill="none" stroke="#c9d4e8" stroke-width="4"/>
    <path d="M118 128 L263 181" stroke="#c9d4e8" stroke-width="7" stroke-linecap="round"/>


    <text x="170.0" y="244" fill="#c9d4e8" font-size="15.5" font-weight="600" text-anchor="middle"
          font-family="system-ui,sans-serif">Elbows under</text>
    <text x="170.0" y="263" fill="#8b97ad" font-size="12" text-anchor="middle"
          font-family="system-ui,sans-serif">shoulders stacked</text>
    <line x1="340" y1="22" x2="340" y2="254" stroke="#5d6b85" stroke-width="1" opacity=".3"/></g>

  <g transform="translate(340,0)">
    <line x1="14" y1="186" x2="326" y2="186" stroke="#5d6b85" stroke-width="3"/>
    <path d="M118 182 L158 182" stroke="#c9d4e8" stroke-width="7" stroke-linecap="round"/>
    <path d="M118 182 L90 135" stroke="#c9d4e8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="75" cy="122" r="12.5" fill="none" stroke="#c9d4e8" stroke-width="4"/>
    <path d="M90 135 L237 181" stroke="#c9d4e8" stroke-width="7" stroke-linecap="round"/>
    <line x1="90" y1="196" x2="118" y2="196" stroke="#36d399" stroke-width="2.5"/>
    <text x="104" y="212" fill="#36d399" font-size="11.5" text-anchor="middle" font-family="system-ui,sans-serif">lever</text>
    <text x="170.0" y="244" fill="#c9d4e8" font-size="15.5" font-weight="600" text-anchor="middle"
          font-family="system-ui,sans-serif">A hand ahead</text>
    <text x="170.0" y="263" fill="#8b97ad" font-size="12" text-anchor="middle"
          font-family="system-ui,sans-serif">the lever starts</text>
    <line x1="340" y1="22" x2="340" y2="254" stroke="#5d6b85" stroke-width="1" opacity=".3"/></g>

  <g transform="translate(680,0)">
    <line x1="14" y1="186" x2="326" y2="186" stroke="#5d6b85" stroke-width="3"/>
    <path d="M118 182 L158 182" stroke="#c9d4e8" stroke-width="7" stroke-linecap="round"/>
    <path d="M118 182 L68 157" stroke="#c9d4e8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="53" cy="144" r="12.5" fill="none" stroke="#c9d4e8" stroke-width="4"/>
    <path d="M68 157 L221 181" stroke="#c9d4e8" stroke-width="7" stroke-linecap="round"/>
    <line x1="68" y1="196" x2="118" y2="196" stroke="#36d399" stroke-width="2.5"/>
    <text x="93" y="212" fill="#36d399" font-size="11.5" text-anchor="middle" font-family="system-ui,sans-serif">lever</text>
    <text x="170.0" y="244" fill="#c9d4e8" font-size="15.5" font-weight="600" text-anchor="middle"
          font-family="system-ui,sans-serif">Fully ahead</text>
    <text x="170.0" y="263" fill="#8b97ad" font-size="12" text-anchor="middle"
          font-family="system-ui,sans-serif">as far as you can hold</text>
    </g>
</svg>
